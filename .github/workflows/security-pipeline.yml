
name: DevSecOps Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  # JOB 1: Validate the project files
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Application Files
        run: |
          test -f app/src/app.py
          test -f app/src/requirements.txt
          test -f app/Dockerfile
          echo "All required application files exist."

  # JOB 2: Build and test the Docker application
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Docker Version
        run: docker --version

      - name: Build Docker Image
        run: docker build -t devsecops-sample-app:ci ./app

      - name: Start Application Container
        run: |
          docker run -d \
            -p 5000:5000 \
            --name devsecops-app \
            devsecops-sample-app:ci

      - name: Test Application Health
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application health check passed."
              exit 0
            fi
            echo "Waiting for application to start..."
            sleep 2
          done

          echo "Application health check failed."
          docker logs devsecops-app
          exit 1

      - name: Stop Application Container
        if: always()
        run: docker rm -f devsecops-app || true

# FUTURE INTEGRATION ORDER:
